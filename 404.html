<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konbit Home Services</title>
<meta name="description" content="Konbit Home Services. Our website is coming soon.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://konbithomeservices.com/">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Archivo'; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; src: url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2'); }
@font-face { font-family: 'Libre Caslon Text'; font-style: italic; font-weight: 400; font-display: swap; src: url('/fonts/libre-caslon-text-latin-400-italic.woff2') format('woff2'); }
:root { --charcoal: #17191C; --champagne: #C9AE78; --text: #F4F2EE; --muted: #A9ADB3; --line: rgba(244, 242, 238, 0.16); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  background: var(--charcoal); color: var(--text);
  font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.5;
}
.brand { background: #FFFFFF; display: flex; justify-content: center; padding: clamp(2rem, 6vw, 3.5rem) 1rem; }
.brand img { display: block; width: min(330px, 70vw); height: auto; }
main {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  gap: 1.75rem; padding: clamp(3rem, 9vw, 6rem) 1rem;
}
.rule { width: 3rem; height: 1px; background: var(--champagne); }
h1 {
  margin: 0; max-width: 18ch; font-size: clamp(1.9rem, 1.1rem + 3.6vw, 3.75rem); font-weight: 650; font-stretch: 115%;
  line-height: 1.02; letter-spacing: -0.01em; text-transform: uppercase; text-wrap: balance;
}
.motto { margin: 0; display: flex; flex-direction: column; gap: .35rem; }
.motto-kreyol { margin: 0; font-family: 'Libre Caslon Text', Georgia, serif; font-style: italic; color: var(--champagne);
  font-size: clamp(1.35rem, 1.1rem + 1.2vw, 2rem); line-height: 1.2; }
.motto-english { margin: 0; color: var(--muted); font-size: 1rem; }
footer { border-top: 1px solid var(--line); padding: 1.25rem 1rem; text-align: center; color: var(--muted); font-size: .875rem; }
</style>
</head>
<body>
<header class="brand">
  <img src="/img/konbit-logo.png" alt="Konbit Home Services" width="330" height="240">
</header>
<main>
  <div class="rule" aria-hidden="true"></div>
  <h1>Our website is coming soon</h1>
  <div class="motto">
    <p class="motto-kreyol" lang="ht">Men anpil, chay pa lou.</p>
    <p class="motto-english">Many hands, light work.</p>
  </div>
</main>
<footer>&copy; 2026 Konbit Home Services</footer>
</body>
</html>
